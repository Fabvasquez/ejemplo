<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificador Inteligente de Lentes</title>
    <link rel="stylesheet" href="style.css">
    <!-- TensorFlow.js y Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
</head>
<body>
    <div class="main-wrapper">
        <header class="app-header">
            <h1>Detector de Lentes 👓</h1>
            <p>Sube una fotografía para que la inteligencia artificial analice si la persona usa lentes o no.</p>
        </header>

        <div class="dashboard-grid">
            <!-- Tarjeta 1: Carga y Vista Previa -->
            <div class="card upload-card">
                <h2>Cargar Imagen</h2>
                <div class="drop-zone" onclick="document.getElementById('image-upload').click()">
                    <input type="file" id="image-upload" accept="image/*" onchange="previewAndPredict(event)">
                    <div id="drop-zone-content">
                        <span class="icon">📁</span>
                        <p>Haz clic aquí o arrastra tu imagen</p>
                        <span class="sub-text">PNG, JPG o WEBP</span>
                    </div>
                    <img id="image-preview" src="#" alt="Vista previa" style="display:none;" />
                </div>
            </div>

            <!-- Tarjeta 2: Resultados de la Predicción -->
            <div class="card results-card">
                <h2>Resultados del Análisis</h2>
                <div id="label-container" class="results-list">
                    <div class="placeholder-result">
                        <p>Esperando imagen...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
