<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector de Lentes</title>
    <link rel="stylesheet" href="style.css">
    <!-- TensorFlow.js y Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Detector de Lentes 👓</h1>
            <p>Sube una foto para clasificar si usa lentes o no</p>
        </header>

        <main>
            <!-- Sección de Carga -->
            <div class="upload-section">
                <input type="file" id="image-upload" accept="image/*" onchange="previewAndPredict(event)">
                <label for="image-upload" class="upload-btn">📁 Seleccionar Imagen</label>
                
                <!-- Imagen centrada con bordes y sombra -->
                <div class="preview-container">
                    <img id="image-preview" src="#" alt="Vista previa de la imagen" style="display:none;" />
                </div>
            </div>

            <!-- Sección de Resultados -->
            <div class="results-container">
                <h2>Resultados de la Predicción</h2>
                <div id="label-container">
                    <p class="placeholder-text">Sube una imagen para ver el análisis...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
